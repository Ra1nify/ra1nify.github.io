backend:
  name: github
  repo: ra1nify/ra1nify.github.io
  branch: main
local_backend: true

media_folder: assets/img
public_folder: /img

collections:
  - name: post
    label: 文章
    folder: content/post
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    view_filters:
      - label: 草稿
        field: draft
        pattern: "true"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 描述, name: description, widget: string, required: false }
      - { label: 发布日期, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: "HH:mm:ss", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: 封面图片, name: image, widget: image, required: false, media_library: { config: { max_file_size: 10000000 } } }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 分类, name: categories, widget: list, required: false }
      - { label: 数学公式, name: math, widget: boolean, required: false, default: false }
      - { label: 允许评论, name: comments, widget: boolean, required: false, default: true }
      - { label: 草稿, name: draft, widget: boolean, required: false, default: false }
      - { label: 排序权重, name: weight, widget: number, required: false }
      - label: 构建选项
        name: build
        widget: object
        required: false
        fields:
          - { label: 列表显示, name: list, widget: select, options: [always, local, never], required: false, default: always }
      - { label: 正文, name: body, widget: markdown }

  - name: page
    label: 页面
    label_singular: 页面
    folder: content/page
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 描述, name: description, widget: string, required: false }
      - { label: 封面图片, name: image, widget: image, required: false }
      - { label: 草稿, name: draft, widget: boolean, required: false, default: false }
      - { label: 正文, name: body, widget: markdown }
